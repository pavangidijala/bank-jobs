name: Daily Bank Jobs Scrape

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Run scraper
        working-directory: scraper
        run: node scrape.js

      - name: Commit updated jobs.json
        run: |
          git config user.name "bankjobs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/jobs.json
          git diff --staged --quiet || git commit -m "chore: daily job update $(date -u +%F)"
          git push
